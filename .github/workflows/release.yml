name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write       # build attestation: proves the .exe was built here, from this commit
  attestations: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: python test_widetweaks.py
      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os, widetweaks as w; t = os.environ['GITHUB_REF_NAME']; assert t == 'v' + w.VERSION, f'tag {t} but VERSION {w.VERSION}'"
      - run: pip install pyinstaller pillow lz4
      - run: pyinstaller --onefile --windowed --name WideTweaks --icon icon.ico --add-data "fixes/*.json;fixes" --add-data "icon.png;." widetweaks.py
      - name: Linux zip (code and fix files; pictures are downloaded when shown)
        run: python -c "import glob, zipfile; z = zipfile.ZipFile('WideTweaks_Linux.zip', 'w', zipfile.ZIP_DEFLATED); [z.write(f) for f in ['widetweaks.py', 'widetweaks_app.py', 'icon.png', 'widetweaks.desktop', 'README.md', 'LICENSE'] + sorted(glob.glob('fixes/*.json'))]; z.close()"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: |
            dist/WideTweaks.exe
            WideTweaks_Linux.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}      # a test build (run by hand): no release, just the files
        with:
          name: test-build
          path: |
            dist/WideTweaks.exe
            WideTweaks_Linux.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/WideTweaks.exe
            WideTweaks_Linux.zip
