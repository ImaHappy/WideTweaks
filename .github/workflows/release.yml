name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_widefix.py
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name widefix --add-data "fixes;fixes" widefix.py
      - run: Compress-Archive -Path widefix.py, fixes, README.md, LICENSE -DestinationPath widefix-python.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/widefix.exe
            widefix-python.zip
